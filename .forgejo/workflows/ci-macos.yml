# macOS CI for airs-cli-rs on the maintainer's runner 'jadzia' (docs/TESTING.md section 10).
#
# Manual only (workflow_dispatch). Forgejo evaluates a job's `if` only once a runner with
# its label picks it up, so a job whose label no runner serves waits forever even when
# its condition is false; keeping macOS out of ci.yml stops every push run hanging.
# `macos-arm64` is a placeholder: rename it to the label jadzia registers with. Before
# dispatching, meet the self-hosted runner requirements in docs/TESTING.md section 10:
# jadzia runs jobs directly on the host, so its runner must be repository-scoped and run
# as a dedicated user with no keychain, signing or tenant access. AIRS_RS_LIVE is never
# set here.
name: CI macOS

on:
  workflow_dispatch:

env:
  # pnpm/action-setup has no Node 24 major yet; force it (and any JS action) onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  # No debug info: smaller target/ (and cache), faster links. Tests do not need it.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'
  MSRV: '1.89'
  PNPM_VERSION: '10.6.5'

jobs:
  macos:
    runs-on: macos-arm64
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The whole history and the tags: the TypeScript reference is a commit in this
          # repository's own history (docs/TESTING.md §3).
          fetch-depth: 0

      - name: Install Rust (stable with rustfmt and clippy, plus the MSRV)
        id: rust
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if [ ! -x "$cargo_home/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          fi
          echo "$cargo_home/bin" >> "$GITHUB_PATH"
          export PATH="$cargo_home/bin:$PATH"
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install "$MSRV" --profile minimal
          rustup default stable
          rustc --version
          echo "key=$(rustc -vV | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo cache
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: cargo-macos-${{ runner.arch }}-${{ steps.rust.outputs.key }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-macos-${{ runner.arch }}-${{ steps.rust.outputs.key }}-

      - uses: https://github.com/pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: https://github.com/actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Read the reference pin
        id: pin
        run: |
          set -euo pipefail
          commit=$(sed -n 's/^PINNED_COMMIT="\${AIRS_TS_COMMIT:-\([0-9a-f]\{40\}\)}"$/\1/p' scripts/build-reference-cli.sh)
          [ "${#commit}" -eq 40 ] || { echo "cannot read PINNED_COMMIT from scripts/build-reference-cli.sh" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore the TypeScript reference build
        id: refcache
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .reference/prisma-airs-cli
          key: ts-reference-v1-macos-${{ runner.arch }}-node${{ steps.pin.outputs.node }}-${{ steps.pin.outputs.commit }}-${{ hashFiles('scripts/build-reference-cli.sh') }}

      - name: Build the TypeScript reference
        run: |
          set -euo pipefail
          # On a cache miss the script clones the pin from this checkout's own history
          # (fetch-depth 0 above), so no key or second clone over the network is needed.
          export AIRS_TS_SOURCE="$GITHUB_WORKSPACE"
          scripts/build-reference-cli.sh
          scripts/build-reference-cli.sh --verify

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo check on the MSRV
        run: cargo +"$MSRV" check --workspace --all-targets --locked --target-dir target/msrv

      - name: cargo test (parity required)
        run: |
          set -euo pipefail
          unset AIRS_RS_LIVE AIRS_E2E_TENANT AIRS_E2E_PROFILE AIRS_ALLOW_PARITY_SKIP
          AIRS_REQUIRE_PARITY=1 cargo test --workspace --locked --no-fail-fast
